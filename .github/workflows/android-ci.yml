name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint, test, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon is pinned to JDK 21 (gradle/gradle-daemon-jvm.properties, ADR-0001 D5).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # One invocation so Gradle can parallelise across modules. Screenshot verification fails on any pixel diff
      # beyond the per-test threshold (doc 05 §10); diff images are uploaded below.
      - name: Assemble, Detekt, Lint, Konsist, unit + migration tests, screenshot verify, coverage
        run: >
          ./gradlew --continue --no-daemon
          assembleDebug
          detekt
          lintDebug
          :konsist:test
          testDebugUnitTest test
          verifyRoborazziDebug
          koverXmlReport

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/**
            build/reports/kover/**

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/outputs/roborazzi/**
            **/src/test/screenshots/*_compare.png

  record-screenshots:
    # Manual: regenerate Roborazzi baselines in CI's environment and download them as an artifact.
    name: Record screenshot baselines
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: "**/src/test/screenshots/*.png"
