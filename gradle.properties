# Project-wide Gradle settings. IDE settings can override these.
# Build JVM: see gradle/gradle-daemon-jvm.properties (JDK 21 — ADR-0001 D5). Launcher may be any JDK 17+.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

# AGP 9 defaults (built-in Kotlin, new DSL) are relied on and not restated here — see the agp-9-upgrade guidance.
android.nonTransitiveRClass=true

# Deliberate opt-out of an AGP 9 default: LiteRT 2.2.0 ships `litert` and `litert-api` with the same namespace
# (com.google.ai.edge.litert), which the unique-namespace validation rejects at manifest merge. Remove once Google
# fixes the artifacts; our own modules keep unique namespaces via the convention plugins + Konsist (ADR-0001 D4).
android.uniquePackageNames=false

# Set -Pmantis.composeCompilerReports=true to write Compose compiler metrics/reports under build/compose_compiler.
mantis.composeCompilerReports=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
